# Captured from historical hecmedia/lib/graphql.js @ 711fd3610f93
# (live Lambda@Edge v146 contract). Nested Post.categories(where:) resolves
# against PostToCategoryConnectionWhereArgs — the 2026-08-06 failure mode.

query LegacyPostCategoriesFlatList {
  posts(first: 1, where: { orderby: { field: DATE, order: DESC } }) {
    nodes {
      title
      excerpt(format: RENDERED)
      categories(where: { shouldOutputInFlatList: true }, first: 3) {
        nodes {
          name
          link
        }
      }
    }
  }
}

query LegacyEventExcerpt {
  events(first: 1) {
    nodes {
      title
      excerpt(format: RENDERED)
    }
  }
}

query LegacyEventCategoriesFlatList {
  eventCategories(first: 5, where: { shouldOutputInFlatList: true }) {
    nodes {
      name
      slug
    }
  }
}
