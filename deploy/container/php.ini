display_errors = Off
log_errors = On
expose_php = Off
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
max_input_vars = 10000
post_max_size = 128M
upload_max_filesize = 64M
opcache.enable = 1
opcache.validate_timestamps = 0
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax
