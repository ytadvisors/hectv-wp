# Isolated local WordPress staging harness for HEC acceptance testing.
# No production AWS, credentials, dumps, or production data.
# Binds only to 127.0.0.1 and uses fixture-only Docker volumes.

services:
  db:
    image: mysql:5.7@sha256:4bc6bc963e6d8443453676cae56536f4b8156d78bae03c0145cbe47c2aad73bb
    platform: linux/amd64
    container_name: hectv-wp-staging-db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-devroot}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wordpress}
      MYSQL_USER: ${MYSQL_USER:-wordpress}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
    volumes:
      - staging_db_data:/var/lib/mysql
    ports:
      - "127.0.0.1:13308:3306"
    healthcheck:
      test:
        [
          "CMD",
          "mysql",
          "-h",
          "127.0.0.1",
          "-u${MYSQL_USER:-wordpress}",
          "-p${MYSQL_PASSWORD:-wordpress}",
          "-e",
          "SELECT 1",
          "${MYSQL_DATABASE:-wordpress}",
        ]
      interval: 15s
      timeout: 60s
      retries: 20
      start_period: 60s

  wordpress:
    build:
      context: ..
      dockerfile: staging-harness/Dockerfile
    image: hectv-wp-local-staging:dev
    container_name: hectv-wp-staging-wp
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress}
      WORDPRESS_DB_USER: ${MYSQL_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
      WORDPRESS_DEBUG: 1
      HECTV_ENVIRONMENT: local
      HECTV_PUBLIC_READ_ONLY: 1
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', 'http://localhost:8092');
        define('WP_SITEURL', 'http://localhost:8092');
        define('WP_DEBUG_DISPLAY', false);
        @ini_set('display_errors', 0);
        define('GRAPHQL_DEBUG', true);
        define('HECTV_CMS_SEED_MENUS', true);
        putenv('HECTV_ENVIRONMENT=local');
        putenv('HECTV_PUBLIC_READ_ONLY=1');
    volumes:
      - staging_wp_data:/var/www/html
    ports:
      - "127.0.0.1:8092:80"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/wp-login.php"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  wpcli:
    image: wordpress:cli-php8.2@sha256:837d55d02196b5f4c92d236317c6d089ab1471348b31d1708888d444a0390979
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress}
      WORDPRESS_DB_USER: ${MYSQL_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
    volumes:
      - staging_wp_data:/var/www/html
      - ./seed.sh:/seed.sh:ro
    entrypoint: ["wp"]
    command: ["--info"]

volumes:
  staging_db_data:
  staging_wp_data:
