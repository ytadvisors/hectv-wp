# Isolated worker-mba WordPress staging harness for HEC WPGraphQL modernization.
# Task #83360. No production AWS, credentials, dumps, or licensed ACF bridge.
#
# Binds only to 127.0.0.1. Sync to worker-mba and run from ~/hectv-wp-staging
# (or replace ~/hecmedia-dev-wp after rsync).

services:
  db:
    image: mysql:5.7
    platform: linux/amd64
    container_name: hectv-wp-staging-db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-devroot}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wordpress}
      MYSQL_USER: ${MYSQL_USER:-wordpress}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
    volumes:
      - staging_db_data:/var/lib/mysql
    ports:
      - "127.0.0.1:13308:3306"
    healthcheck:
      test:
        [
          "CMD",
          "mysql",
          "-h",
          "127.0.0.1",
          "-u${MYSQL_USER:-wordpress}",
          "-p${MYSQL_PASSWORD:-wordpress}",
          "-e",
          "SELECT 1",
          "${MYSQL_DATABASE:-wordpress}",
        ]
      interval: 15s
      timeout: 60s
      retries: 20
      start_period: 60s

  wordpress:
    image: wordpress:6.8-php8.2-apache
    container_name: hectv-wp-staging-wp
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress}
      WORDPRESS_DB_USER: ${MYSQL_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
      WORDPRESS_DEBUG: 1
      HECTV_ENVIRONMENT: local
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', 'http://localhost:8092');
        define('WP_SITEURL', 'http://localhost:8092');
        define('GRAPHQL_DEBUG', true);
        define('HECTV_CMS_SEED_MENUS', true);
        putenv('HECTV_ENVIRONMENT=local');
    volumes:
      - staging_wp_data:/var/www/html
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins:ro
      # Git-canonical CMS fields (Post Details, site settings, menus, GraphQL).
      - ../wp-content/mu-plugins/hectv-cms-fields.php:/var/www/html/wp-content/mu-plugins/hectv-cms-fields.php:ro
      - ../wp-content/mu-plugins/hectv-cms-fields:/var/www/html/wp-content/mu-plugins/hectv-cms-fields:ro
    ports:
      - "127.0.0.1:8092:80"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/wp-login.php"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  wpcli:
    image: wordpress:cli-php8.2
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress}
      WORDPRESS_DB_USER: ${MYSQL_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
    volumes:
      - staging_wp_data:/var/www/html
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins:ro
      - ../wp-content/mu-plugins/hectv-cms-fields.php:/var/www/html/wp-content/mu-plugins/hectv-cms-fields.php:ro
      - ../wp-content/mu-plugins/hectv-cms-fields:/var/www/html/wp-content/mu-plugins/hectv-cms-fields:ro
      - ./seed.sh:/seed.sh:ro
    entrypoint: ["wp"]
    command: ["--info"]

volumes:
  staging_db_data:
  staging_wp_data:
