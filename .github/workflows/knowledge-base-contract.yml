name: HEC knowledge-base contracts

on:
  pull_request:
    paths:
      - ".github/workflows/knowledge-base-contract.yml"
      - "infra/knowledge-base/**"
      - "scripts/knowledge-base/**"
      - "tests/knowledge-base-s3-vectors.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false
      - name: Initialize without production state
        run: terraform -chdir=infra/knowledge-base init -backend=false -input=false
      - name: Validate the replacement and migration guards
        run: |
          set -euo pipefail
          bash tests/knowledge-base-s3-vectors.sh
          terraform -chdir=infra/knowledge-base validate
